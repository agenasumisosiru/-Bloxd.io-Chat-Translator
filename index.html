<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloxd.io Chat Translator</title>
    <style>
      :root {
        --bg1: #e0f2fe;
        --bg2: #f8fafc;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --shadow: rgba(15, 23, 42, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        width: min(100%, 900px);
        padding: 24px;
      }

      .card {
        background: rgba(255,255,255,0.9);
        border-radius: 18px;
        box-shadow: 0 20px 45px var(--shadow);
        padding: 28px 22px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.68);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 9999;
      }

      .overlay.hidden {
        display: none;
      }

      .modal {
        width: min(420px, 100%);
        background: var(--panel);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
        padding: 28px 22px 22px;
        text-align: center;
      }

      .modal h2 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 4vw, 2rem);
        color: var(--text);
      }

      .modal p {
        margin: 0 0 22px;
        color: var(--muted);
      }

      .close-btn {
        display: inline-block;
        width: 100%;
        max-width: 220px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        padding: 14px 18px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.12s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .close-btn:active {
        transform: scale(0.98);
      }

      .close-btn:hover {
        background: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <div id="popup" class="overlay" aria-live="assertive">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="popup-title">
        <h2 id="popup-title">PCでご利用ください</h2>
        <p>
          このツールはPCでの利用を前提にしています。<br />
          モバイル端末では使えない場合があります。
        </p>
        <button id="closePopup" class="close-btn" type="button">閉じる</button>
      </div>
    </div>

    <main class="app">
      <div class="card">
        <h1>Bloxd.io Chat Translator</h1>
        <p>
          ここがメインのページです。<br />
          ポップアップは「閉じる」ボタンで閉じられます。
        </p>
      </div>
    </main>

    <script>
      const popup = document.getElementById('popup');
      const closePopupBtn = document.getElementById('closePopup');

      function hidePopup() {
        popup.classList.add('hidden');
      }

      closePopupBtn.addEventListener('click', hidePopup);

      // モバイルではEscキーがないのでボタンのみで閉じられる設計にしています
      popup.addEventListener('click', (event) => {
        if (event.target === popup) {
          hidePopup();
        }
      });
    </script>
  </body>
</html>
